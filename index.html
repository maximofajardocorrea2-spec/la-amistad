<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
  
  <style>
    /* ==========================================
       1. VARIABLES Y TEMAS (LA AMISTAD)
       ========================================== */
    :root {
      --primary: #059669; /* Verde oscuro solicitado */
      --primary-light: #d1fae5;
      --primary-hover: #047857;
      --bg-app: #f0fdf4;
      --bg-sidebar: #f8fafc;
      --text: #1e293b;
      --bubble-user: #d1fae5;
      --bubble-ai: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body { 
      font-family: 'Outfit', sans-serif; 
      background: var(--bg-app); 
      color: var(--text); 
      height: 100vh; 
      display: flex; 
      overflow: hidden; 
    }

    .hidden { display: none !important; }
    .icon { font-family: 'Material Symbols Rounded'; font-size: 24px; user-select: none; }

    /* ==========================================
       2. SIDEBAR Y ESTRUCTURA DE NAVEGACIÓN
       ========================================== */
    #sidebar { 
      width: 280px; 
      background: var(--bg-sidebar); 
      height: 100%; 
      position: fixed; 
      left: -280px; 
      z-index: 1000; 
      transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
      box-shadow: 2px 0 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }
    #sidebar.open { left: 0; }
    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 900; display: none; }
    #overlay.show { display: block; }

    .navbar { 
      height: 64px; 
      padding: 0 20px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      background: white; 
      border-bottom: 1px solid #e2e8f0;
      z-index: 50;
    }

    /* ==========================================
       3. DASHBOARD Y BIENVENIDA
       ========================================== */
    #view-dashboard { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      flex: 1;
      width: 100%;
    }
    .welcome-header { margin-bottom: 35px; animation: fadeIn 0.8s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    .mode-card { 
      width: 155px; 
      height: 175px; 
      background: white; 
      border: 2px solid #e2e8f0; 
      border-radius: 24px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      transition: 0.3s; 
    }
    .mode-card:hover { border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

    /* ==========================================
       4. DISEÑO DE LA SUPER-PÍLDORA ENVOLVENTE
       ========================================== */
    .super-capsule-frame {
      display: flex;
      align-items: center;
      border: 2px solid var(--primary); /* El marco verde oscuro que rodea todo */
      border-radius: 40px; /* Circunferencia que sigue el borde de los botones */
      background: white;
      padding: 4px;
      height: 52px;
      position: relative;
      min-width: 320px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }

    .pill-btn-internal {
      background: var(--primary);
      color: white;
      height: 40px;
      width: 85px; /* Tamaño idéntico para Elegir y Probar */
      border-radius: 35px; /* Circunferencia interna */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      flex-shrink: 0;
    }
    .pill-btn-internal:hover { transform: scale(1.05); filter: brightness(1.1); }

    .pill-center-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--primary);
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
    }

    /* ==========================================
       5. INPUT Y ACCIONES REACTIVAS
       ========================================== */
    .input-wrapper { 
      padding: 20px 15px 55px; 
      background: white; 
      border-top: 1px solid #e2e8f0; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 15px; 
      overflow: visible;
    }
    .input-bar { 
      width: 100%; 
      max-width: 700px; 
      background: #f1f5f9; 
      border-radius: 35px; 
      padding: 8px 12px; 
      display: flex; 
      align-items: center; 
    }
    .msg-input { 
      flex: 1; 
      background: transparent; 
      border: none; 
      outline: none; 
      padding: 10px; 
      font-size: 16px; 
      font-family: 'Outfit'; 
    }
    
    .action-icon-btn { 
      width: 46px; 
      height: 46px; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      color: #64748b; 
      transition: transform 0.1s ease-out; /* Optimizado para AudioContext */
    }
    .btn-send { background: var(--primary); color: white; margin-left: 8px; }

    /* BURBUJAS DE CHAT */
    .bubble { padding: 15px 20px; border-radius: 22px; max-width: 82%; margin-bottom: 12px; font-size: 15px; line-height: 1.6; }
    .bubble.user { background: var(--bubble-user); align-self: flex-end; border-bottom-right-radius: 4px; }
    .bubble.ai { background: var(--bubble-ai); align-self: flex-start; border: 1px solid #e2e8f0; border-top-left-radius: 4px; }

    /* MENÚS FLOTANTES */
    .popup-menu { 
      position: absolute; 
      bottom: 65px; 
      background: white; 
      border-radius: 15px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
      border: 1px solid #e2e8f0; 
      z-index: 200; 
      overflow: hidden; 
      min-width: 180px; 
    }
    .popup-item { padding: 14px 18px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .popup-item:hover { background: #f1f5f9; color: var(--primary); }
  </style>
</head><body>

  <!-- 1. PANEL LATERAL E HISTORIAL -->
  <div id="overlay" onclick="toggleSidebar()"></div>
  <div id="sidebar">
    <div class="sidebar-header">
      <span style="font-weight:800; color:#334155; font-size: 20px">Historial</span>
      <span class="icon" onclick="toggleSidebar()" style="cursor:pointer; width:44px; height:44px; display:flex; align-items:center; justify-content:center;">close</span>
    </div>
    <div style="padding:15px; display:flex; align-items:center; gap:10px; cursor:pointer; color:var(--primary); font-weight:bold;" onclick="goHome(); toggleSidebar()">
      <span class="icon" style="font-size:20px">add</span> Nuevo Chat
    </div>
    <div id="history-container" class="history-list">
        <!-- Los chats se cargarán aquí desde Google -->
    </div>
  </div>

  <div id="main-content" style="width: 100%;">
    
    <!-- 2. BARRA SUPERIOR -->
    <div class="navbar hidden" id="navbar">
      <div class="nav-left">
        <span class="icon" onclick="toggleSidebar()" style="cursor:pointer; width:44px; height:44px; display:flex; align-items:center; justify-content:center;">menu</span>
        <span style="font-weight:800; font-size:18px; color:var(--primary)">ALIADO</span>
      </div>
      <div onclick="goHome()" style="cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;">
        <span class="icon" style="font-size:22px; color:#64748b;">home</span>
        <span style="font-size:10px; font-weight:700; color:#64748b;">Inicio</span>
      </div>
    </div>

    <!-- 3. VISTA DE INICIO (LOGIN) -->
    <div id="view-login" style="height: 100vh; display: flex; align-items: center; justify-content: center;">
      <div style="background: white; padding: 40px; border-radius: 28px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.05); width: 330px;">
        <!-- Busca logo.png en tu repositorio de GitHub -->
        <img id="app-logo" src="logo.png" style="width: 130px; margin-bottom: 15px;" onerror="this.src='https://via.placeholder.com/130x100?text=La+Amistad'">
        <h2 style="color: var(--primary); margin-bottom: 5px;">La Amistad</h2>
        <p style="font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; font-weight: 700;">Tecnología Educativa</p>
        
        <input type="text" id="cedula" inputmode="numeric" style="width: 100%; padding: 16px; margin: 25px 0; border: 2px solid #e2e8f0; border-radius: 14px; text-align: center; font-size: 18px; font-weight: 700; color: var(--primary);" placeholder="Cédula">
        
        <button class="btn-primary" onclick="login()">COMENZAR</button>
      </div>
    </div>

    <!-- 4. DASHBOARD (RECIBIMIENTO RESTAURADO) -->
    <div id="view-dashboard" class="hidden" style="padding: 40px 20px;">
      <div style="max-width: 600px; margin: 0 auto; text-align: center;">
        <div class="welcome-header">
          <div style="font-size:12px; font-weight:800; color:#94a3b8; text-transform:uppercase; letter-spacing:1px; margin-bottom:10px;">Proyecto La Amistad</div>
          <h1 style="color:#1e293b; font-size: 34px;">Hola, <span id="user-name" style="color:var(--primary)">Máximo</span></h1>
          <p style="color:#64748b; font-size: 18px; margin-top: 5px;">¿Qué desafío estudiaremos hoy?</p>
        </div>
        
        <div style="display: flex; gap: 20px; justify-content: center; margin-top: 20px;">
          <div class="mode-card" onclick="startChat('quiz')">
            <span class="icon" style="font-size: 48px; color: #004aad;">edit_note</span>
            <b style="color: #004aad; margin-top: 15px; font-size: 16px;">Modo Escrito</b>
          </div>
          <div class="mode-card" onclick="startChat('oral')">
            <span class="icon" style="font-size: 48px; color: var(--primary);">mic</span>
            <b style="color: var(--primary); margin-top: 15px; font-size: 16px;">Modo Oral</b>
          </div>
        </div>
      </div>
    </div>

    <!-- 5. VISTA DE CHAT -->
    <div id="view-chat" class="hidden" style="display: flex; flex-direction: column; height: 100vh;">
      <div id="chat-box" class="chat-scroll">
         <div class="chat-content-width" id="chat-container"></div>
      </div>
      
      <div class="input-wrapper">
        <div class="suggestion-chips">
          <div class="chips-group">
            <div class="action-chip" onclick="sendChip('💡 Dame una pista')">💡 Pista</div>
            <div class="action-chip" onclick="sendChip('🔥 Hazlo más difícil')">🔥 Más difícil</div>
          </div>

          <!-- LA SUPER-PÍLDORA ENVOLVENTE (SOLO MODO ORAL) -->
          <div class="super-capsule-frame hidden" id="voice-config">
            <!-- Extremo Izquierdo -->
            <div class="pill-btn-internal" onclick="toggleVoiceMenu()">ELEGIR</div>
            
            <!-- Centro -->
            <div class="pill-center-content">
               <span class="icon" style="font-size: 18px;">record_voice_over</span>
               <span id="current-voice-label">Voz Masculina 1</span>
            </div>
            
            <!-- Extremo Derecho -->
            <div class="pill-btn-internal" onclick="testVoice()">PROBAR</div>
            
            <!-- Menú Flotante de Voces -->
            <div id="voice-menu" class="popup-menu hidden" style="right: 0; bottom: 65px;">
               <div class="popup-item" onclick="selectVoice('Aoede', 'Voz Femenina 1')">👩 Femenina 1</div>
               <div class="popup-item" onclick="selectVoice('Puck', 'Voz Masculina 1')">👨 Masculina 1</div>
            </div>
          </div>
        </div>

        <!-- BARRA DE ENTRADA -->
        <div class="input-bar">
          <input type="text" id="msg-input" class="msg-input" placeholder="Escribe tu duda...">
          
          <div class="action-icon-btn" id="btn-mic" onclick="toggleMic()">
            <span class="icon">mic</span>
          </div>
          
          <div class="action-icon-btn btn-send" onclick="sendMsg()">
            <span class="icon" style="font-size: 20px;">send</span>
          </div>
        </div>
      </div>
    </div>

  </div><script>
  // ==========================================
  // 1. CONFIGURACIÓN DEL PUENTE (PEGA TU LINK AQUÍ)
  // ==========================================
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmG_HFoRiEahrdo9vtTaNLbCikctIvpMd3pHr0K2H2ygeGgoM3LHG4x2AAizt1qUWT2g/exec";

  // Variables de estado
  let uid = null;
  let mode = null;
  let chatId = null;
  let isListening = false;
  let recognition = null;
  let audioContext = null;
  let analyser = null;
  let dataArray = null;
  let animationFrame = null;

  // ==========================================
  // 2. LOGICA DE NAVEGACIÓN Y LOGIN
  // ==========================================
  function login() {
    const cedulaInput = document.getElementById('cedula').value.trim();
    if (!cedulaInput) return alert("Por favor, ingresa tu cédula.");
    
    // Guardamos la cédula para las peticiones
    uid = cedulaInput;
    
    // Simulación de entrada (Luego el Script validará el nombre real)
    document.getElementById('user-name').innerText = "Máximo"; 
    document.getElementById('view-login').classList.add('hidden');
    document.getElementById('view-dashboard').classList.remove('hidden');
    document.getElementById('navbar').classList.remove('hidden');
  }

  function goHome() {
    document.getElementById('view-chat').classList.add('hidden');
    document.getElementById('view-dashboard').classList.remove('hidden');
    document.body.style.backgroundColor = "#f0fdf4";
    document.getElementById('chat-container').innerHTML = "";
    chatId = null;
  }

  function startChat(m) {
    mode = m;
    chatId = Date.now().toString();
    document.getElementById('view-dashboard').classList.add('hidden');
    document.getElementById('view-chat').classList.remove('hidden');
    
    const voiceConfig = document.getElementById('voice-config');
    if (mode === 'oral') {
      voiceConfig.classList.remove('hidden');
      addMsg("<b>Modo Oral activado.</b> Puedes usar el micrófono para hablarme directamente.", "ai");
    } else {
      voiceConfig.classList.add('hidden');
      addMsg("<b>Modo Escrito activado.</b> ¿En qué puedo ayudarte con tus estudios hoy?", "ai");
    }
  }

  // ==========================================
  // 3. COMUNICACIÓN CON GEMINI (EL PUENTE)
  // ==========================================
  async function sendMsg() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text) return;

    addMsg(text, 'user');
    input.value = "";
    const loaderId = addMsg("Pensando...", 'ai');

    try {
      // Enviamos los datos a tu Google Apps Script
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors', // Importante para evitar bloqueos de seguridad
        body: JSON.stringify({
          action: 'talkToGemini',
          text: text,
          mode: mode,
          uid: uid,
          chatId: chatId
        })
      });

      // Nota: Al usar 'no-cors' no podemos leer la respuesta directamente por seguridad del navegador.
      // Para una conexión completa con respuesta, tu Script debe manejar cabeceras CORS.
      // Por ahora, esto garantiza que el mensaje LLEGUE a tu base de datos.
      
      document.getElementById(loaderId).innerHTML = "Mensaje enviado a La Amistad. (Conecta CORS en tu Script para ver la respuesta aquí).";
    } catch (error) {
      document.getElementById(loaderId).innerHTML = "Error de conexión. Revisa el link de tu Script.";
    }
  }

  function addMsg(html, role) {
    const id = "msg-" + Date.now();
    const chatContainer = document.getElementById('chat-container');
    const div = document.createElement('div');
    div.id = id;
    div.className = "bubble " + role;
    div.innerHTML = html;
    chatContainer.appendChild(div);
    document.getElementById('chat-box').scrollTop = chatContainer.scrollHeight;
    return id;
  }

  // ==========================================
  // 4. ECUALIZADOR Y MICRÓFONO REACTIVO
  // ==========================================
  async function initAudioVisualizer() {
    if (audioContext) return;
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const source = audioContext.createMediaStreamSource(stream);
    source.connect(analyser);
    analyser.fftSize = 64;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    animateMic();
  }

  function animateMic() {
    if (!isListening) {
      document.getElementById('btn-mic').style.transform = "scale(1)";
      return;
    }
    analyser.getByteFrequencyData(dataArray);
    let volume = dataArray.reduce((a, b) => a + b) / dataArray.length;
    let scale = 1 + (volume / 100); 
    document.getElementById('btn-mic').style.transform = `scale(${Math.min(scale, 1.4)})`;
    animationFrame = requestAnimationFrame(animateMic);
  }

  if ('webkitSpeechRecognition' in window) {
    recognition = new webkitSpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'es-UY';

    recognition.onresult = (event) => {
      let interimTranscript = '';
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        interimTranscript += event.results[i][0].transcript;
      }
      document.getElementById('msg-input').value = interimTranscript;
    };
  }

  async function toggleMic() {
    if (!isListening) {
      await initAudioVisualizer();
      recognition.start();
      isListening = true;
      document.getElementById('btn-mic').classList.add('mic-active');
    } else {
      recognition.stop();
      isListening = false;
      document.getElementById('btn-mic').classList.remove('mic-active');
      setTimeout(sendMsg, 600);
    }
  }

  // ==========================================
  // 5. FUNCIONES DE LA SUPER-PÍLDORA
  // ==========================================
  function toggleVoiceMenu() {
    document.getElementById('voice-menu').classList.toggle('hidden');
  }

  function selectVoice(id, name) {
    document.getElementById('current-voice-label').innerText = name;
    toggleVoiceMenu();
  }

  function testVoice() {
    const voice = document.getElementById('current-voice-label').innerText;
    const msg = new SpeechSynthesisUtterance("Hola Máximo, estoy probando el sistema de voz de La Amistad.");
    msg.lang = 'es-ES';
    msg.pitch = voice.includes('Femenina') ? 1.2 : 0.8;
    window.speechSynthesis.speak(msg);
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  }
</script>
